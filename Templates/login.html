<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Page</title>

    <style>
        /* Background */
        body {
            font-family: Arial, sans-serif;
            background-color: #cccdf7;
            margin: 0;
            padding: 0;
        }

        /* Login Form */
        form {
            width: 350px;
            margin: 80px auto;
            padding: 30px;
            background-color: rgb(254, 213, 231);
            border: 1px solid #ddd;
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        /* Heading */
        h1 {
            text-align: center;
            color: #363636;
            font-size: 28px;
            margin-bottom: 30px;
        }

        /* Labels */
        label {
            display: block;
            margin-bottom: 8px;
            color: #8b3434;
            font-weight: bold;
        }

        /* Input Boxes */
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 7px;
            font-size: 14px;
            background-color: white;
        }

        /* Input Focus */
        input:focus {
            border-color: #8b3434;
            outline: none;
            box-shadow: 0 0 5px rgba(139, 52, 52, 0.3);
        }

        /* Login Button */
        input[type="submit"] {
            display: block;
            margin: 10px auto 0;
            padding: 12px 35px;
            background-color: #000000;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Button Hover */
        input[type="submit"]:hover {
            background-color: #6f2929;
        }

        /* Button Click */
        input[type="submit"]:active {
            transform: scale(0.97);
        }

        /* Responsive Design */
        @media (max-width: 500px) {
            form {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <form id="loginform" action="/login" method="POST">

        <h1>Login</h1>

        <label for="username">Username / Email:</label>

        <input
            id="username"
            type="text"
            placeholder="Enter your username or email"
            name="username"
            required
        >

        <label for="password">Password:</label>

        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            name="password"
            required
        >

        <input type="submit" value="Login">

    </form>

</body>

</html>
