
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Employee Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: 0.3s;
        }

        .login-container {
            width: 380px;
            padding: 35px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #4c63d2;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }

        .theme-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .theme-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .light-button {
            background: #f5f5f5;
            color: #222;
            border: 1px solid #ccc !important;
        }

        .dark-button {
            background: #222;
            color: white;
        }

        /* Dark Mode */
        body.dark {
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        body.dark .login-container {
            background: #222;
        }

        body.dark h2,
        body.dark label {
            color: white;
        }

        body.dark .subtitle {
            color: #ccc;
        }

        body.dark input {
            background: #333;
            color: white;
            border-color: #555;
        }

        body.dark .register-link {
            color: #ddd;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Employee Management System</h2>

        <p class="subtitle">Login to your account</p>

        <form action="/login" method="POST">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="login-button">
                Login
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="/register">Register</a>
        </div>

        <!-- Separate Theme Buttons -->
        <div class="theme-buttons">

            <button class="light-button" onclick="lightMode()">
                ☀️ Light Mode
            </button>

            <button class="dark-button" onclick="darkMode()">
                🌙 Dark Mode
            </button>

        </div>

    </div>

    <script>
        function lightMode() {
            document.body.classList.remove("dark");
            localStorage.setItem("theme", "light");
        }

        function darkMode() {
            document.body.classList.add("dark");
            localStorage.setItem("theme", "dark");
        }

        // Keep selected theme after refreshing
        window.onload = function () {
            const theme = localStorage.getItem("theme");

            if (theme === "dark") {
                document.body.classList.add("dark");
            } else {
                document.body.classList.remove("dark");
            }
        };
    </script>

</body>
</html>
