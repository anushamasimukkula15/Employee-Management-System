
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #cccdf7;
            color: #333;
            transition: 0.3s;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px 25px;
            background: #343a40;
            color: white;
        }

        .navbar h2 {
            margin: 0;
            font-size: 21px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .nav-links a,
        .theme-btn {
            text-decoration: none;
            border: none;
            border-radius: 7px;
            padding: 10px 14px;
            background: #495057;
            color: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .nav-links a:hover,
        .theme-btn:hover {
            background: #6c757d;
        }

        .btn-logout {
            background: #dc3545 !important;
        }

        /* ================= WELCOME ================= */

        .welcome {
            text-align: center;
            margin: 80px 15px;
        }

        .welcome h1 {
            font-size: 34px;
            color: #363636;
            margin-bottom: 15px;
        }

        .welcome p {
            font-size: 24px;
            font-weight: bold;
            color: #444;
        }

        /* ================= DARK MODE ================= */

        body.dark-mode {
            background: #121212;
            color: #f1f1f1;
        }

        body.dark-mode .welcome h1 {
            color: white;
        }

        body.dark-mode .welcome p {
            color: #ccc;
        }

        body.dark-mode .theme-btn {
            background: #f5f5f5;
            color: #222;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 700px) {

            .navbar {
                justify-content: center;
                text-align: center;
            }

            .navbar h2 {
                width: 100%;
            }

            .welcome h1 {
                font-size: 26px;
            }

            .welcome p {
                font-size: 20px;
            }

            .nav-links a,
            .theme-btn {
                font-size: 12px;
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <h2>👨‍💼 Employee Management</h2>

        <div class="nav-links">

            <a href="/">🏠 Home</a>

            <a href="/employees">👥 Employees</a>

            <a href="/add-employee">➕ Add Employee</a>

            <a href="/search">🔍 Search</a>

            <button id="themeToggle" class="theme-btn">
                🌙 Dark Mode
            </button>

            <a href="/logout" class="btn-logout">
                🚪 Logout
            </a>

        </div>

    </nav>

    <!-- ================= WELCOME MESSAGE ================= -->

    <section class="welcome">

        <h1>
            Welcome Anusha!
        </h1>

        <p>
            Employee Management System
        </p>

    </section>

    <!-- ================= THEME JAVASCRIPT ================= -->

    <script>

        const themeToggle = document.getElementById("themeToggle");

        const currentTheme = "{{ theme|default('light') }}";

        if (currentTheme === "dark") {

            document.body.classList.add("dark-mode");

            themeToggle.textContent = "☀️ Light Mode";

        }

        themeToggle.addEventListener("click", function () {

            const isDark =
                document.body.classList.contains("dark-mode");

            const newTheme = isDark ? "light" : "dark";

            window.location.href = "/set-theme/" + newTheme;

        });

    </script>

</body>

</html>
