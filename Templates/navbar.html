
<style>
    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background: var(--card-bg, #ffffff);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        border-radius: 10px;
        margin-bottom: 25px;
    }

    .logo {
        font-size: 22px;
        font-weight: bold;
        color: var(--text-color, #222222);
        text-decoration: none;
    }

    .nav-links {
        display: flex;
        align-items: center;
        gap: 10px;
        list-style: none;
        margin: 0;
        padding: 0;
        flex-wrap: wrap;
    }

    .nav-links a {
        text-decoration: none;
        padding: 9px 14px;
        border-radius: 6px;
        color: var(--text-color, #222222);
        font-weight: 500;
        transition: 0.3s;
    }

    .nav-links a:hover {
        background: #007bff;
        color: white;
    }

    .theme-btn {
        border: none;
        padding: 9px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        background: #eeeeee;
        color: #222222;
        text-decoration: none;
    }

    .theme-btn:hover {
        background: #007bff;
        color: white;
    }

    .logout-btn {
        background: #dc3545 !important;
        color: white !important;
    }

    .logout-btn:hover {
        background: #b02a37 !important;
    }

    .login-btn {
        background: #198754;
        color: white !important;
    }

    .register-btn {
        background: #0d6efd;
        color: white !important;
    }

    @media (max-width: 768px) {
        .navbar {
            flex-direction: column;
            gap: 15px;
            padding: 15px;
        }

        .nav-links {
            justify-content: center;
        }
    }
</style>

<nav class="navbar">

    <a href="/" class="logo">
        👨‍💼 Employee Management
    </a>

    <ul class="nav-links">

        <li>
            <a href="/">🏠 Home</a>
        </li>

        <li>
            <a href="/employees">👥 Employees</a>
        </li>

        <li>
            <a href="/add-employee">➕ Add Employee</a>
        </li>

        <li>
            <a href="/search">🔍 Search</a>
        </li>

        <li>
            <a href="/set-theme/light" class="theme-btn">
                ☀️ Light
            </a>
        </li>

        <li>
            <a href="/set-theme/dark" class="theme-btn">
                🌙 Dark
            </a>
        </li>

        {% if session.get("user_id") %}

        <li>
            <a href="/logout" class="logout-btn">
                🚪 Logout
            </a>
        </li>

        {% else %}

        <li>
            <a href="/login" class="login-btn">
                🔐 Login
            </a>
        </li>

        <li>
            <a href="/register" class="register-btn">
                📝 Register
            </a>
        </li>

        {% endif %}

    </ul>

</nav>
